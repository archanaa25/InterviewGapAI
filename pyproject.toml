[project]
name = "interviewgap-ai"
version = "0.1.0"
description = "Interview question corpus preparation, retrieval evaluation, and Pinecone ingestion."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2,<3",
    "langchain-core>=1.6.2",
    "langsmith>=0.12.2,<0.13",
    "openai>=3.8.0",
    "pinecone>=10.0.0",
    "python-dotenv>=1.2.3",
    "python-docx>=1.2.0,<2",
    "pypdf>=6.18.0,<7",
    "rank-bm25>=0.2.2",
    "streamlit>=1.63.0,<2",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "ipywidgets>=8.1,<9",
    "jupyterlab>=4.6.3",
    "pytest>=9.1.1,<10",
]
