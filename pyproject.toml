[project]
name = "interviewgap-ai"
version = "0.1.0"
description = "Interview question corpus preparation, retrieval evaluation, and Pinecone ingestion."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2,<3",
    "langchain-core>=1.6.2",
    "langsmith>=0.12.2,<0.13",
    "openai>=3.8.0",
    "pinecone>=10.0.0",
    "python-dotenv>=1.2.3",
    "python-docx>=1.2.0,<2",
    "pypdf>=6.18.0,<7",
    "rank-bm25>=0.2.2",
    "streamlit>=1.63.0,<2",
]

[tool.pytest.ini_options]
# Both suites, so a bare `pytest` cannot miss one. This matters because
# `python -m unittest discover -s tests` silently skips any file that does
# not subclass unittest.TestCase - tests/test_evaluation_agent.py is written
# in pytest style and was running nowhere. pytest executes unittest.TestCase
# classes natively, so one runner covers every test either style.
testpaths = ["tests", "ui/tests"]
# Both suites import `src.*` and `ui.*` from the project root. Neither test
# directory is a package, so pytest puts only that directory on sys.path and
# every import fails at collection - `uv run --locked pytest` did not run at
# all without this. `python -m pytest` happened to work because it adds the
# working directory; this makes the documented command work on its own.
pythonpath = ["."]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "ipywidgets>=8.1,<9",
    "jupyterlab>=4.6.3",
    "pytest>=9.1.1,<10",
]
